[project]
name = "postmortem"
version = "0.1.0"
description = "A Claude skill that writes a blameless incident postmortem from the incident's own sources."
requires-python = ">=3.11"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: outdated syntax.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design.
"evals/**" = ["S101"]
