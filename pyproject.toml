[project]
name = "postmortem"
version = "0.3.2"
description = "A Claude skill that writes a blameless postmortem of a bet or an incident: what changed, and who owns each fix."
requires-python = ">=3.11"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 180
target-version = "py311"
# Copied unchanged from the Leader Report at a pinned commit (VENDORED.json); linted there, never edited here.
extend-exclude = ["skills/postmortem/scripts/vendor"]

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: outdated syntax.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design.
"evals/**" = ["S101", "S603"]
# The page's CSS and plain-words tables read best one rule or entry per line.
"skills/postmortem/scripts/render_html.py" = ["E501"]
